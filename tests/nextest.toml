# Process-per-test execution; timeouts and leaked capture pipes fail closed.
# Selection itself is the runner's responsibility: the all/library suites pass
# an explicit filter expression built from the curated family manifest in
# tests/runner/src/lib.rs, which also guards the listing against silent loss.
nextest-version = "0.9.114"

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "5s", terminate-after = 4, grace-period = "1s" }
leak-timeout = { period = "1s", result = "fail" }
status-level = "all"
failure-output = "immediate-final"
success-output = "never"

[profile.specifications]

[profile.support]
default-filter = "(package(=fshell-test-support) & !binary(=namespace_containment)) | package(=fshell-test-runner)"

[profile.support.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.library]

[profile.library.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.executable]
default-filter = "package(=fshell-specifications) & binary(=cli_execution)"

[profile.executable.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

# Kernel prerequisites are mandatory in this explicitly selected Linux profile.
# Portable profiles do not schedule these probes on unsuitable hosts.
[profile.containment]
default-filter = "package(=fshell-test-support) & binary(=namespace_containment)"

[profile.containment.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.specifications.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true
