# Process-per-test execution; timeouts and leaked capture pipes fail closed.
nextest-version = "0.9.114"

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "5s", terminate-after = 4, grace-period = "1s" }
leak-timeout = { period = "1s", result = "fail" }
status-level = "all"
failure-output = "immediate-final"
success-output = "never"

[profile.specifications]
# Include owner-local read and descriptor-output regressions by exact family.
default-filter = """
package(=fshell-test-support) | package(=fshell-specifications) | package(=fshell-test-runner) |
(package(=fshell-posix) & (test(posix_builtins::read_cmd::tests::) | test(eval::tests::builtin_output_)))
"""

[profile.support]
default-filter = "package(=fshell-test-support) | package(=fshell-test-runner)"

[profile.support.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.library]
default-filter = """
package(=fshell-specifications) |
(package(=fshell-posix) & (test(posix_builtins::read_cmd::tests::) | test(eval::tests::builtin_output_)))
"""

[profile.library.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.executable]
default-filter = "package(=fshell-specifications) & binary(=cli_execution)"

[profile.executable.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true

[profile.specifications.junit]
path = "specifications.xml"
store-success-output = false
store-failure-output = true
