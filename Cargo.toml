[workspace]
resolver = "2"
members = [
    "crates/fshell-core",
    "crates/fshell-capabilities",
    "crates/fshell-engine",
    "crates/fshell-builtins",
    "crates/fshell-bridge",
    "crates/fshell-repl",
    "crates/fshell-ls",
    "crates/fshell-render",
    "crates/fshell-sandbox",
    "crates/fshell-hash",
    "crates/fshell-git",
    "crates/fshell-config-tui",
    "crates/fshell-panes",
    "crates/fshell-posix",
    "fuzz",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Francesco Duca <f.duca00@gmail.com>"]
license = "GPL-3.0-or-later"
description = "A modern shell"
repository = "https://github.com/FraSharp/fshell"
readme = "README.md"
homepage = "https://github.com/FraSharp/fshell"
keywords = ["shell", "cli", "pipeline", "structured-data", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[package]
name = "fshell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autobins = false
include = ["src/**/*", "build.rs", "LICENSE", "COPYING", "README.md"]

[features]
default = ["full"]
full = [
    "sandbox",
    "vault",
    "ai",
    "http",
    "sql",
    "chart",
    "config-tui",
    "notify",
    "ff",
    "replace",
    "extract",
]
minimal = []
sandbox = ["fshell-builtins/sandbox"]
vault = ["fshell-builtins/vault"]
ai = ["fshell-builtins/ai", "fshell-repl/ai"]
http = ["fshell-builtins/http"]
sql = ["fshell-builtins/sql"]
chart = ["fshell-builtins/chart"]
config-tui = ["fshell-builtins/config-tui"]
notify = ["fshell-builtins/notify"]
ff = ["fshell-builtins/ff"]
replace = ["fshell-builtins/replace"]
extract = ["fshell-builtins/extract"]

[[bin]]
name = "fsh"
path = "src/main.rs"

[dependencies]
fshell-core = { path = "crates/fshell-core" }
fshell-capabilities = { path = "crates/fshell-capabilities" }
fshell-engine = { path = "crates/fshell-engine" }
fshell-builtins = { path = "crates/fshell-builtins" }
fshell-bridge = { path = "crates/fshell-bridge" }
fshell-repl = { path = "crates/fshell-repl" }
fshell-render = { path = "crates/fshell-render" }
fshell-hash = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
strip-ansi-escapes = "0.2.1"
indexmap = { workspace = true }
ustr = { workspace = true }
crossterm = { workspace = true }
fshell-posix = { workspace = true }

[workspace.dependencies]
fshell-hash = { path = "crates/fshell-hash" }
fshell-posix = { path = "crates/fshell-posix" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "net", "signal", "process", "fs", "time", "io-util", "io-std", "sync", "macros"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
rmp-serde = "1.3.1"
ustr = { version = "1.1.0", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
notify = "8.2.0"
clap = { version = "4.6.1", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
indexmap = { version = "2.14.0", features = ["serde"] }
reedline = "0.49.0"
nucleo-matcher = "0.3"
arboard = "3.4"
base64 = "0.22"
thiserror = "2.0.18"
toml_edit = { version = "0.25", features = ["serde"] }
parking_lot = "0.12"
libc = "0.2.186"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rayon = "1.12"
unicode-width = "0.2"
unicode-segmentation = "1.12.0"
terminal_size = "0.4"
globset = "0.4"
walkdir = "2"
csv = "1.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "gzip"] }
tempfile = "3"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
cc = "1.2"
dirs = "6"
nu-ansi-term = "0.50.3"
proptest = "1.6"
regex = "1.12"
rand = "0.10"
getrandom = "0.3"
hostname = "0.4"
bytes = "1.12"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
bincode = "1.3"
vte = "0.15"
portable-pty = "0.9"
brush-parser = "0.4"
glob = "0.3"
async-recursion = "1.1"
r2d2 = "0.8"
lscolors = "0.21"
hex = "0.4"
flate2 = "1.1"
memmap2 = "0.9"
stacker = "0.1.25"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
expect_used = "allow"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
rmp-serde = { workspace = true }
ustr = { workspace = true }
fshell-sandbox = { path = "crates/fshell-sandbox" }
fshell-hash = { workspace = true }
fshell-panes = { path = "crates/fshell-panes" }
ratatui = { workspace = true }
proptest = { workspace = true }




