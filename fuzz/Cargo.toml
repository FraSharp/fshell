[package]
name = "fshell-fuzz"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fshell-core = { workspace = true }
fshell-capabilities = { workspace = true }
fshell-engine = { workspace = true }
fshell-builtins = { workspace = true }
fshell-posix = { workspace = true }
fshell-hash = { workspace = true }
brush-parser = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rmp-serde = { workspace = true }
ustr = { workspace = true }
regex = { workspace = true }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false

[[bin]]
name = "posix_parser"
path = "fuzz_targets/posix_parser.rs"
test = false
doc = false

[[bin]]
name = "posix_arithmetic"
path = "fuzz_targets/posix_arithmetic.rs"
test = false
doc = false

[[bin]]
name = "posix_expand"
path = "fuzz_targets/posix_expand.rs"
test = false
doc = false

[[bin]]
name = "posix_eval"
path = "fuzz_targets/posix_eval.rs"
test = false
doc = false

[[bin]]
name = "engine_eval"
path = "fuzz_targets/engine_eval.rs"
test = false
doc = false

[[bin]]
name = "extended_glob"
path = "fuzz_targets/extended_glob.rs"
test = false
doc = false

[[bin]]
name = "pipeline_formatters"
path = "fuzz_targets/pipeline_formatters.rs"
test = false
doc = false

[[bin]]
name = "codecs"
path = "fuzz_targets/codecs.rs"
test = false
doc = false

[[bin]]
name = "sponge_hash"
path = "fuzz_targets/sponge_hash.rs"
test = false
doc = false
