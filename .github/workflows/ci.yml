name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm     # native ARM64 Linux (no qemu/cross toolchain)
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel       # native Intel macOS
            target: x86_64-apple-darwin
          - os: macos-latest         # native ARM64 macOS
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup target add ${{ matrix.target }}
      - name: Format Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Build (default features)
        run: cargo build --target ${{ matrix.target }}
      - name: Test (default features)
        run: cargo test --target ${{ matrix.target }}
      - name: Native Language Baseline
        if: matrix.os == 'ubuntu-latest'
        run: FSH_BIN="target/${{ matrix.target }}/debug/fsh" scripts/fsh-language-baseline.sh
      - name: Check Fuzz Targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fshell-fuzz
      - name: Clippy (default features)
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Clippy (non-archive workspace)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --exclude fshell-archive --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-audit
      - name: Audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

  full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm     # native ARM64 Linux (no qemu/cross toolchain)
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel       # native Intel macOS
            target: x86_64-apple-darwin
          - os: macos-latest         # native ARM64 macOS
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: rustup target add ${{ matrix.target }}
      - name: Install archive build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libarchive-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libb2-dev libxml2-dev libssl-dev libacl1-dev
      - name: Install archive build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config libarchive libb2 xz zstd lz4
      - name: Build (full features)
        run: cargo build --features full --target ${{ matrix.target }}
      - name: Verify portable archive linkage
        run: scripts/check-archive-linkage.sh target/${{ matrix.target }}/debug/fsh
      - name: Test (full features)
        run: cargo test --features full --target ${{ matrix.target }}
      - name: Clippy (full features)
        run: cargo clippy --features full --target ${{ matrix.target }} --all-targets -- -D warnings

  specifications:
    name: Specifications (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.114
      - name: Run specifications
        run: cargo run --locked -p fshell-test-runner
      - name: Check test infrastructure
        run: cargo clippy --locked -p fshell-test-support -p fshell-test-runner -p fshell-specifications --all-targets -- -D warnings
      - name: Upload specification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specifications-${{ matrix.os }}
          path: target/nextest/specifications/specifications.xml
          if-no-files-found: error

  containment:
    name: Linux containment (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.114
      - name: Provision unprivileged namespace prerequisite
        run: |
          # Hosted ephemeral runner only. Do not run probes as root or fall back
          # to weaker containment when Ubuntu's AppArmor policy blocks userns.
          test "$(id -u)" -ne 0
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify namespace containment
        run: cargo run --locked -p fshell-test-runner -- --suite containment
      - name: Upload containment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-${{ matrix.os }}
          path: target/nextest/containment/specifications.xml
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install archive build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libarchive-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libb2-dev libxml2-dev libssl-dev libacl1-dev
      - name: Check (default features)
        run: cargo check --locked
      - name: Check (full features)
        run: cargo check --locked --features full
      - name: Check test infrastructure
        run: cargo check --locked -p fshell-test-support -p fshell-test-runner -p fshell-specifications --all-targets
