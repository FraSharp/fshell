name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm     # native ARM64 Linux (no qemu/cross toolchain)
            target: aarch64-unknown-linux-gnu
          - os: macos-latest         # native ARM64 macOS
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: rustup target add ${{ matrix.target }}
      - name: Format Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Build
        run: cargo build --target ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Check Fuzz Targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p fshell-fuzz
      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-audit
      - name: Audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit
