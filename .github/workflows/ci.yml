name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install QEMU and cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static binfmt-support
      - run: rustup target add ${{ matrix.target }}
      - name: Format Check
        if: ${{ !matrix.cross && matrix.os == 'ubuntu-latest' }}
        run: cargo fmt --check
      - name: Build
        run: cargo build --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      - name: Test (Native)
        if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}
      - name: Test (Emulated aarch64 QEMU)
        if: matrix.cross
        run: cargo test --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
      - name: Check Fuzz Targets
        if: ${{ !matrix.cross && matrix.os == 'ubuntu-latest' }}
        run: cargo check -p fshell-fuzz
      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      - name: Install cargo-audit
        if: ${{ !matrix.cross && matrix.os == 'ubuntu-latest' }}
        uses: taiki-e/install-action@cargo-audit
      - name: Audit
        if: ${{ !matrix.cross && matrix.os == 'ubuntu-latest' }}
        run: cargo audit
